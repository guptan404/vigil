name: vigil
description: Umbrella package for Vigil core, Dio interceptor, and Flutter UI.
version: 0.1.0
publish_to: "none"
repository: https://example.com/vigil

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  vigil_core:
    path: ../vigil_core
  vigil_backend:
    path: ../vigil_backend
  vigil_dio:
    path: ../vigil_dio
  vigil_ui:
    path: ../vigil_ui

dev_dependencies:
  flutter_lints: ^6.0.0
