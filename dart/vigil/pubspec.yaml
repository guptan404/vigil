name: vigil
description: Flutter-first network inspection toolkit combining request capture, Dio interception, an in-app inspector, and optional backend upload.
version: 0.1.0
resolution: workspace
repository: https://github.com/guptan404/vigil
issue_tracker: https://github.com/guptan404/vigil/issues

topics:
  - flutter
  - http
  - network-monitoring
  - debugging
  - developer-tools

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  vigil_backend: ^0.1.0
  vigil_core: ^0.1.0
  vigil_dio: ^0.1.0
  vigil_ui: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
