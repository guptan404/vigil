name: vigil_ui
description: A Flutter network inspector overlay with request search, filters, cURL export, timing metrics, and shake-to-open support.
version: 0.1.0
resolution: workspace
repository: https://github.com/guptan404/vigil
issue_tracker: https://github.com/guptan404/vigil/issues

topics:
  - flutter
  - network-monitoring
  - debugging
  - developer-tools
  - observability

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^6.1.2
  vigil_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
